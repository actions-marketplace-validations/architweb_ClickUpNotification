name: "📢 Send ClickUp Notification"
description: "Sends notification to ClickUp with deployment information"

inputs:
  clickup_api_token:
    description: "ClickUp API Token"
    required: true
  clickup_workspace_id:
    description: "ClickUp Workspace ID"
    required: true
  clickup_channel_id:
    description: "ClickUp Channel ID"
    required: true
  clickup_project_name:
    description: "ClickUp Project Name for the message"
    required: true
  title:
    description: "Custom title for the notification message"
    required: false
    default: ""
  description:
    description: "Custom description for the notification message"
    required: false
    default: ""
  formatted_duration:
    description: "Formatted duration from duration step"
    required: false
    default: "unknown"
  commit_file:
    description: "Path to commit changelog file"
    required: false
    default: ""
  test_mode:
    description: "Test mode - preview message without sending to ClickUp"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: 👤📝 Get User Info & Resolve Names (Parallel)
      id: parallel-info
      shell: bash
      run: |
        USER_INFO=$(mktemp)
        NAMES_FILE=$(mktemp)

        # Start user info fetch in background
        (
          chmod +x "$GITHUB_ACTION_PATH/scripts/get-user-info.sh"
          "$GITHUB_ACTION_PATH/scripts/get-user-info.sh" "$USER_INFO"
        ) &
        USER_PID=$!

        # Start name resolution in background (only if test mode)
        if [[ "${{ inputs.test_mode }}" == "true" ]]; then
          (
            chmod +x "$GITHUB_ACTION_PATH/scripts/resolve-names.sh"
            "$GITHUB_ACTION_PATH/scripts/resolve-names.sh" \
              "${{ inputs.clickup_api_token }}" \
              "${{ inputs.clickup_workspace_id }}" \
              "$NAMES_FILE"
          ) &
          NAMES_PID=$!
        fi

        # Wait for user info to complete
        wait $USER_PID

        # Wait for names resolution if running
        if [[ "${{ inputs.test_mode }}" == "true" ]]; then
          wait $NAMES_PID
        fi

        echo "USER_INFO=$USER_INFO" >> $GITHUB_OUTPUT
        echo "NAMES_FILE=$NAMES_FILE" >> $GITHUB_OUTPUT

    - name: Build Message
      id: message
      shell: bash
      run: |
        MESSAGE_FILE=$(mktemp)
        chmod +x "$GITHUB_ACTION_PATH/scripts/build-message.sh"
        "$GITHUB_ACTION_PATH/scripts/build-message.sh" \
          "${{ steps.parallel-info.outputs.USER_INFO }}" \
          "${{ inputs.title }}" \
          "${{ inputs.description }}" \
          "${{ inputs.formatted_duration }}" \
          "${{ inputs.commit_file }}" \
          "$MESSAGE_FILE"
        echo "MESSAGE_FILE=$MESSAGE_FILE" >> $GITHUB_OUTPUT

    - name: Resolve Names
      id: names
      if: ${{ inputs.test_mode == 'true' }}
      shell: bash
      run: |
        # Names already resolved in parallel step
        echo "NAMES_FILE=${{ steps.parallel-info.outputs.NAMES_FILE }}" >> $GITHUB_OUTPUT

    - name: Preview Message
      if: ${{ inputs.test_mode == 'true' }}
      shell: bash
      run: |
        chmod +x "$GITHUB_ACTION_PATH/scripts/preview-message.sh"
        "$GITHUB_ACTION_PATH/scripts/preview-message.sh" \
          "${{ steps.message.outputs.MESSAGE_FILE }}" \
          "${{ steps.names.outputs.NAMES_FILE }}" \
          "${{ inputs.clickup_workspace_id }}" \
        rm -f "${{ steps.message.outputs.MESSAGE_FILE }}" "${{ steps.names.outputs.NAMES_FILE }}" "${{ inputs.commit_file }}"

    - name: Send to ClickUp
      if: ${{ inputs.test_mode != 'true' }}
      shell: bash
      run: |
        chmod +x "$GITHUB_ACTION_PATH/scripts/send-to-clickup.sh"
        "$GITHUB_ACTION_PATH/scripts/send-to-clickup.sh" \
          "${{ steps.message.outputs.MESSAGE_FILE }}" \
          "${{ inputs.clickup_api_token }}" \
          "${{ inputs.clickup_workspace_id }}" \
          "${{ inputs.clickup_channel_id }}"
        rm -f "${{ steps.message.outputs.MESSAGE_FILE }}" "${{ inputs.commit_file }}"
