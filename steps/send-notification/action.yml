name: "📢 Send ClickUp Notification"
description: "Sends notification to ClickUp with deployment information"

inputs:
  clickup_api_token:
    description: "ClickUp API Token"
    required: true
  clickup_workspace_id:
    description: "ClickUp Workspace ID"
    required: true
  clickup_channel_id:
    description: "ClickUp Channel ID"
    required: true
  clickup_project_name:
    description: "ClickUp Project Name for the message"
    required: true
  title:
    description: "Custom title for the notification message"
    required: false
    default: ""
  description:
    description: "Custom description for the notification message"
    required: false
    default: ""
  formatted_duration:
    description: "Formatted duration from duration step"
    required: false
    default: "unknown"
  commit_file:
    description: "Path to commit changelog file"
    required: false
    default: ""
  test_mode:
    description: "Test mode - preview message without sending to ClickUp"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Send Notification
      shell: bash
      run: |
        FORMATTED_DURATION="${{ inputs.formatted_duration }}"
        COMMIT_FILE="${{ inputs.commit_file }}"
        TEST_MODE="${{ inputs.test_mode }}"

        TRIGGERING_USER_NAME=$(curl -sf -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/users/${TRIGGERING_ACTOR}" | jq -r '.name // ""')

        if [ -z "$TRIGGERING_USER_NAME" ]; then
            TRIGGERING_USER_NAME="${TRIGGERING_ACTOR}"
        fi

        if [ -n "${{ inputs.title }}" ]; then
          BASE_MESSAGE="🚀 **${GITHUB_REF_NAME}** | **${CLICKUP_PROJECT_NAME}** | ${{ inputs.title }}"
        else
          BASE_MESSAGE="🚀 **${CLICKUP_PROJECT_NAME}** deployed to **${GITHUB_REF_NAME}**"
        fi

        DEPLOY_INFO="_Triggered by: ${TRIGGERING_USER_NAME}"
        [ "$FORMATTED_DURATION" != "unknown" ] && DEPLOY_INFO="${DEPLOY_INFO}, Done in: ${FORMATTED_DURATION}min_"
        [ "$FORMATTED_DURATION" == "unknown" ] && DEPLOY_INFO="${DEPLOY_INFO}_"

        if [ -n "${{ inputs.description }}" ]; then
          FINAL_MESSAGE="${BASE_MESSAGE}\n\n${DEPLOY_INFO}\n\n_${{ inputs.description }}_"
        else
          FINAL_MESSAGE="${BASE_MESSAGE}\n\n${DEPLOY_INFO}"
        fi

        if [ -f "$COMMIT_FILE" ] && [ -s "$COMMIT_FILE" ]; then
          COMMIT_LIST=$(cat "$COMMIT_FILE")
          if [ -n "$COMMIT_LIST" ]; then
            FINAL_MESSAGE="${FINAL_MESSAGE}${COMMIT_LIST}"
          fi
        fi

        MESSAGE_FILE=$(mktemp)
        echo -e "$FINAL_MESSAGE" > "$MESSAGE_FILE"

        PAYLOAD_FILE=$(mktemp)
        jq -n --arg content "$(cat "$MESSAGE_FILE")" '{
          type: "message",
          content_format: "text/md",
          content: $content
        }' > "$PAYLOAD_FILE"

        if [ "$TEST_MODE" == "true" ]; then
          echo "🧪 TEST MODE ENABLED - Message preview (NOT SENT to ClickUp)"
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "📋 PREVIEW OF MESSAGE CONTENT:"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""
          cat "$MESSAGE_FILE"
          echo ""

          # Try to resolve workspace and channel names
          WORKSPACE_NAME="${{ inputs.clickup_workspace_id }}"
          CHANNEL_NAME="${{ inputs.clickup_channel_id }}"

          # Get workspace name from teams API
          TEAMS_RESPONSE=$(curl -s -H "Authorization: ${{ inputs.clickup_api_token }}" \
            "https://api.clickup.com/api/v2/team" 2>/dev/null || echo "")

          if [ -n "$TEAMS_RESPONSE" ]; then
            WORKSPACE_NAME=$(echo "$TEAMS_RESPONSE" | jq -r ".teams[] | select(.id == \"${{ inputs.clickup_workspace_id }}\") | .name" 2>/dev/null || echo "${{ inputs.clickup_workspace_id }}")
          fi

          # Get channel name from channels API
          CHANNELS_RESPONSE=$(curl -s -H "Authorization: ${{ inputs.clickup_api_token }}" \
            "https://api.clickup.com/api/v3/workspaces/${{ inputs.clickup_workspace_id }}/chat/channels" 2>/dev/null || echo "")

          if [ -n "$CHANNELS_RESPONSE" ]; then
            CHANNEL_NAME=$(echo "$CHANNELS_RESPONSE" | jq -r ".channels[] | select(.id == \"${{ inputs.clickup_channel_id }}\") | .name" 2>/dev/null || echo "${{ inputs.clickup_channel_id }}")
          fi

          MESSAGE_LENGTH=$(cat "$MESSAGE_FILE" | wc -c)

          echo "═══════════════════════════════════════════════════════════════"
          echo "📝 MESSAGE DETAILS:"
          echo "═══════════════════════════════════════════════════════════════"
          echo "• Destination: $WORKSPACE_NAME (${{ inputs.clickup_workspace_id }}), $CHANNEL_NAME (${{ inputs.clickup_channel_id }})"
          echo "• Content Format: text/md"
          echo "• Character Count: $MESSAGE_LENGTH characters"
          echo "• API Token: Provided (hidden for security)"
          echo ""
          echo "⚠️  TEST MODE: No actual API call made to ClickUp"
          echo "    Set test_mode to \"false\" to send this message"
          echo "═══════════════════════════════════════════════════════════════"

          rm -f "$MESSAGE_FILE" "$PAYLOAD_FILE" "$COMMIT_FILE"
          exit 0
        fi

        RESPONSE_FILE=$(mktemp)
        HTTP_CODE=$(curl -s -o "$RESPONSE_FILE" -w "%{http_code}" \
          -X POST \
          -H "Content-Type: application/json" \
          -H "Authorization: ${{ inputs.clickup_api_token }}" \
          -d @"$PAYLOAD_FILE" \
          "https://api.clickup.com/api/v3/workspaces/${{ inputs.clickup_workspace_id }}/chat/channels/${{ inputs.clickup_channel_id }}/messages")

        rm -f "$MESSAGE_FILE" "$PAYLOAD_FILE" "$COMMIT_FILE" "$RESPONSE_FILE"

        if [[ "$HTTP_CODE" -ge 200 && "$HTTP_CODE" -lt 300 ]]; then
          echo "--- ClickUp notification sent successfully ---"
        else
          echo "::error::Failed to send notification to ClickUp. HTTP code: $HTTP_CODE"
          exit 1
        fi
