name: "📢 Send ClickUp Notification"
description: "Sends notification to ClickUp with deployment information"

inputs:
  clickup_api_token:
    description: "ClickUp API Token"
    required: true
  clickup_workspace_id:
    description: "ClickUp Workspace ID"
    required: true
  clickup_channel_id:
    description: "ClickUp Channel ID"
    required: true
  clickup_project_name:
    description: "ClickUp Project Name for the message"
    required: true
  title:
    description: "Custom title for the notification message"
    required: false
    default: ""
  description:
    description: "Custom description for the notification message"
    required: false
    default: ""
  formatted_duration:
    description: "Formatted duration from duration step"
    required: false
    default: "unknown"
  commit_file:
    description: "Path to commit changelog file"
    required: false
    default: ""
  test_mode:
    description: "Test mode - preview message without sending to ClickUp"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Get User Information
      id: user-info
      shell: bash
      run: |
        USER_INFO=$(mktemp)
        chmod +x "./steps/send-notification/scripts/get-user-info.sh"
        "./steps/send-notification/scripts/get-user-info.sh" "$USER_INFO"
        echo "USER_INFO=$USER_INFO" >> $GITHUB_OUTPUT

    - name: Build Message
      id: message
      shell: bash
      run: |
        MESSAGE_FILE=$(mktemp)
        chmod +x "./steps/send-notification/scripts/build-message.sh"
        "./steps/send-notification/scripts/build-message.sh" \
          "${{ steps.user-info.outputs.USER_INFO }}" \
          "${{ inputs.title }}" \
          "${{ inputs.description }}" \
          "${{ inputs.formatted_duration }}" \
          "${{ inputs.commit_file }}" \
          "$MESSAGE_FILE"
        echo "MESSAGE_FILE=$MESSAGE_FILE" >> $GITHUB_OUTPUT

    - name: Resolve Names
      id: names
      if: ${{ inputs.test_mode == 'true' }}
      shell: bash
      run: |
        NAMES_FILE=$(mktemp)
        chmod +x "./steps/send-notification/scripts/resolve-names.sh"
        "./steps/send-notification/scripts/resolve-names.sh" \
          "${{ inputs.clickup_api_token }}" \
          "${{ inputs.clickup_workspace_id }}" \
          "${{ inputs.clickup_channel_id }}" \
          "$NAMES_FILE"
        echo "NAMES_FILE=$NAMES_FILE" >> $GITHUB_OUTPUT

    - name: Preview Message
      if: ${{ inputs.test_mode == 'true' }}
      shell: bash
      run: |
        chmod +x "./steps/send-notification/scripts/preview-message.sh"
        "./steps/send-notification/scripts/preview-message.sh" \
          "${{ steps.message.outputs.MESSAGE_FILE }}" \
          "${{ steps.names.outputs.NAMES_FILE }}" \
          "${{ inputs.clickup_workspace_id }}" \
          "${{ inputs.clickup_channel_id }}"
        rm -f "${{ steps.message.outputs.MESSAGE_FILE }}" "${{ steps.names.outputs.NAMES_FILE }}" "${{ inputs.commit_file }}"

    - name: Send to ClickUp
      if: ${{ inputs.test_mode != 'true' }}
      shell: bash
      run: |
        chmod +x "./steps/send-notification/scripts/send-to-clickup.sh"
        "./steps/send-notification/scripts/send-to-clickup.sh" \
          "${{ steps.message.outputs.MESSAGE_FILE }}" \
          "${{ inputs.clickup_api_token }}" \
          "${{ inputs.clickup_workspace_id }}" \
          "${{ inputs.clickup_channel_id }}"
        rm -f "${{ steps.message.outputs.MESSAGE_FILE }}" "${{ inputs.commit_file }}"
