name: "📝 Fetch Commits"
description: "Fetches commit history and formats changelog"

inputs:
  full_commit_message:
    description: "Use the full commit message instead of the first line"
    required: false
    default: "false"
  sort_commits_alphabetically:
    description: "Sort commits alphabetically by commit message (A-Z)"
    required: false
    default: "true"
  show_commit_statistics:
    description: "Show commit statistics in the notification"
    required: false
    default: "false"

outputs:
  commit_file:
    description: "Path to the temporary file containing commit changelog"
    value: ${{ steps.build.outputs.COMMIT_FILE }}

runs:
  using: "composite"
  steps:
    - name: Get Commit Data
      id: get-data
      shell: bash
      run: |
        COMMITS_DATA=$(mktemp)
        chmod +x "./steps/fetch-commits/scripts/get-commit-data.sh"
        "./steps/fetch-commits/scripts/get-commit-data.sh" "$COMMITS_DATA"
        echo "COMMITS_DATA=$COMMITS_DATA" >> $GITHUB_OUTPUT

    - name: Process Commits
      id: process
      shell: bash
      run: |
        COMMITS_OUTPUT=$(mktemp)
        chmod +x "./steps/fetch-commits/scripts/process-commits.sh"
        "./steps/fetch-commits/scripts/process-commits.sh" \
          "${{ steps.get-data.outputs.COMMITS_DATA }}" \
          "${{ inputs.full_commit_message }}" \
          "${{ inputs.sort_commits_alphabetically }}" \
          "$COMMITS_OUTPUT"
        echo "COMMITS_OUTPUT=$COMMITS_OUTPUT" >> $GITHUB_OUTPUT

    - name: Generate Statistics
      id: stats
      if: ${{ inputs.show_commit_statistics == 'true' }}
      shell: bash
      run: |
        STATS_OUTPUT=$(mktemp)
        chmod +x "./steps/fetch-commits/scripts/generate-statistics.sh"
        "./steps/fetch-commits/scripts/generate-statistics.sh" \
          "${{ steps.get-data.outputs.COMMITS_DATA }}" \
          "${{ steps.get-data.outputs.COMMITS_DATA }}.meta" \
          "$STATS_OUTPUT"
        echo "STATS_OUTPUT=$STATS_OUTPUT" >> $GITHUB_OUTPUT

    - name: Build Final Changelog
      id: build
      shell: bash
      run: |
        COMMIT_FILE=$(mktemp)
        chmod +x "./steps/fetch-commits/scripts/build-changelog.sh"
        "./steps/fetch-commits/scripts/build-changelog.sh" \
          "${{ steps.process.outputs.COMMITS_OUTPUT }}" \
          "${{ steps.stats.outputs.STATS_OUTPUT }}" \
          "${{ inputs.show_commit_statistics }}" \
          "$COMMIT_FILE"
        echo "COMMIT_FILE=$COMMIT_FILE" >> $GITHUB_OUTPUT
