name: "Send ClickUp Notification Action"
description: "Fetches commit history (if possible) and sends a notification to ClickUp."

branding:
  icon: "bell"
  color: "orange"

inputs:
  clickup_api_token:
    description: "ClickUp API Token"
    required: true
  clickup_workspace_id:
    description: "ClickUp Workspace ID"
    required: true
  clickup_channel_id:
    description: "ClickUp Channel ID"
    required: true
  clickup_project_name:
    description: "ClickUp Project Name for the message"
    required: true
  title:
    description: "Custom title for the notification message"
    required: false
    default: ""
  description:
    description: "Custom description for the notification message"
    required: false
    default: ""
  show_fetch_duration:
    description: "Show duration information in the notification"
    required: false
    default: "true"
  show_changelog_commits:
    description: "Show changelog commits in the notification"
    required: false
    default: "true"
  full_commit_message:
    description: "Use the full commit message instead of the first line"
    required: false
    default: "true"
  show_commit_statistics:
    description: "Show commit statistics in the notification"
    required: false
    default: "false"
  test_mode:
    description: "Test mode - preview message without sending to ClickUp"
    required: false
    default: "false"
  filter_agent_commits:
    description: "Filter out agent-generated commits (Initial plan, Agent-Logs-Url, Co-authored-by)"
    required: false
    default: "true"
  group_commits_by_type:
    description: "Group commits by conventional commit type instead of by author"
    required: false
    default: "false"
  show_pr_links:
    description: "Show PR links next to commit references"
    required: false
    default: "false"
  staging_emoji:
    description: "Emoji used for staging branch notifications"
    required: false
    default: "🧪"
  production_emoji:
    description: "Emoji used for production branch notifications"
    required: false
    default: "🚀"
  notify_on_failure:
    description: "Send notification when workflow fails (use with workflow_status input)"
    required: false
    default: "false"
  workflow_status:
    description: "Current job status for failure notifications (pass ${ job.status })"
    required: false
    default: "success"

runs:
  using: "composite"
  steps:
    - name: Set Environment Variables
      shell: bash
      run: |
        echo "CLICKUP_WORKSPACE_ID=${{ inputs.clickup_workspace_id }}" >> $GITHUB_ENV
        echo "CLICKUP_PROJECT_NAME=${{ inputs.clickup_project_name }}" >> $GITHUB_ENV
        echo "GITHUB_TOKEN=${{ github.token }}" >> $GITHUB_ENV
        echo "REPO_NAME=$(echo "$GITHUB_REPOSITORY" | cut -d '/' -f 2)" >> $GITHUB_ENV
        echo "TRIGGERING_ACTOR=$GITHUB_ACTOR" >> $GITHUB_ENV
        echo "STAGING_EMOJI=${{ inputs.staging_emoji }}" >> $GITHUB_ENV
        echo "PRODUCTION_EMOJI=${{ inputs.production_emoji }}" >> $GITHUB_ENV

    - name: ⏱️ Fetch Duration
      id: duration
      if: ${{ inputs.show_fetch_duration == 'true' && inputs.workflow_status != 'failure' }}
      uses: architweb/ClickUpNotification/steps/fetch-duration@v3.2.0

    - name: 📝 Fetch Commits
      id: commits
      if: ${{ inputs.show_changelog_commits == 'true' && inputs.workflow_status != 'failure' }}
      uses: architweb/ClickUpNotification/steps/fetch-commits@v3.2.0
      with:
        full_commit_message: ${{ inputs.full_commit_message }}
        show_commit_statistics: ${{ inputs.show_commit_statistics }}
        filter_agent_commits: ${{ inputs.filter_agent_commits }}
        group_commits_by_type: ${{ inputs.group_commits_by_type }}
        show_pr_links: ${{ inputs.show_pr_links }}

    - name: 📢 Send ClickUp Notification
      if: ${{ inputs.workflow_status != 'failure' }}
      uses: architweb/ClickUpNotification/steps/send-notification@v3.2.0
      with:
        clickup_api_token: ${{ inputs.clickup_api_token }}
        clickup_workspace_id: ${{ inputs.clickup_workspace_id }}
        clickup_channel_id: ${{ inputs.clickup_channel_id }}
        clickup_project_name: ${{ inputs.clickup_project_name }}
        title: ${{ inputs.title }}
        description: ${{ inputs.description }}
        test_mode: ${{ inputs.test_mode }}
        formatted_duration: ${{ inputs.show_fetch_duration == 'true' && steps.duration.outputs.formatted_duration || 'unknown' }}
        commit_file: ${{ inputs.show_changelog_commits == 'true' && steps.commits.outputs.commit_file || '' }}

    - name: ❌ Send Failure Notification
      if: ${{ inputs.notify_on_failure == 'true' && inputs.workflow_status == 'failure' }}
      shell: bash
      run: |
        # Get user display name
        TRIGGERING_USER_NAME=""
        if [ -n "$GITHUB_TOKEN" ] && [ -n "$TRIGGERING_ACTOR" ]; then
          TRIGGERING_USER_NAME=$(curl -sf -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/users/${TRIGGERING_ACTOR}" 2>/dev/null | jq -r '.name // ""' 2>/dev/null || echo "")
        fi
        if [ -z "$TRIGGERING_USER_NAME" ] || [ "$TRIGGERING_USER_NAME" = "null" ]; then
          TRIGGERING_USER_NAME="${TRIGGERING_ACTOR:-Unknown User}"
        fi
        TRIGGERING_USER_NAME=$(printf '%s' "$TRIGGERING_USER_NAME" | tr -c '[:alnum:] ' ' ' | tr -s ' ')

        # Determine emoji
        EMOJI="$PRODUCTION_EMOJI"
        if echo "${GITHUB_REF_NAME}" | grep -qi "staging"; then
          EMOJI="$STAGING_EMOJI"
        fi

        # Build failure message
        WORKFLOW_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

        MESSAGE_FILE=$(mktemp)
        printf "%s %s **%s** deployment to **%s** failed!\n\n_Triggered by: %s_\n\n⚠️ The workflow has failed. Check the logs for details.\n🔗 [View Workflow Run](%s)" \
          "❌" "$EMOJI" "$CLICKUP_PROJECT_NAME" "$GITHUB_REF_NAME" "$TRIGGERING_USER_NAME" "$WORKFLOW_URL" > "$MESSAGE_FILE"

        # Send to ClickUp
        PAYLOAD_FILE=$(mktemp)
        jq -n --arg content "$(cat "$MESSAGE_FILE")" '{
          type: "message",
          content_format: "text/md",
          content: $content
        }' > "$PAYLOAD_FILE"

        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
          -X POST \
          -H "Content-Type: application/json" \
          -H "Authorization: ${{ inputs.clickup_api_token }}" \
          -d @"$PAYLOAD_FILE" \
          "https://api.clickup.com/api/v3/workspaces/${{ inputs.clickup_workspace_id }}/chat/channels/${{ inputs.clickup_channel_id }}/messages")

        # Cleanup
        rm -f "$PAYLOAD_FILE" "$MESSAGE_FILE"

        if [[ "$HTTP_CODE" -ge 200 && "$HTTP_CODE" -lt 300 ]]; then
          echo "--- ClickUp failure notification sent successfully ---"
        else
          echo "::error::Failed to send failure notification. HTTP code: $HTTP_CODE"
          exit 1
        fi
